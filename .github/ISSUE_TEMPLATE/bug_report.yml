name: 缺陷报告
description: 报告一个可复现的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供完整、可复现的信息，以便快速定位问题。
        提交前请先搜索现有 Issue，避免重复。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望的结果是什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 添加直播间 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App 版本
      description: 可在设置页查看，或取自 Release 的 tag 名
      placeholder: 例如 v0.1.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 例如 小米 14 / Android 14
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: 安装包类型
      options:
        - arm64-v8a 精简包
        - universal 通用包
        - 自行构建
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关的 logcat、截图或录屏（可选，粘贴文本即可）
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 其他可能相关的上下文（可选）
    validations:
      required: false