name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先搜索现有 Issue，避免重复。
        请注意：本项目是**纯弹幕查看器**，不实现登录账号、发送弹幕、互动等功能。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你遇到了什么场景或痛点？为什么现有功能无法满足？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它以怎样的方式实现或呈现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你尝试过或思考过的其他做法（可选）
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考截图、链接或其他上下文（可选）
    validations:
      required: false