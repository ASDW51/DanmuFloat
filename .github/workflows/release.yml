name: Release APK

# 发布方式：
#   1) 推 v* tag 自动构建并发布（tag 必须与 pubspec.yaml 的 version 一致）
#   2) Actions 页面手动 Run workflow（可留空 tag，按 pubspec.yaml 版本自动生成 vX.Y.Z）
# 版本唯一来源是 pubspec.yaml 的 version 字段，避免 tag 与 App 内版本号不一致。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag，如 v0.1.0。留空则按 pubspec.yaml 的 version 自动生成'
        required: false
      prerelease:
        description: '标记为预发布（Pre-release）'
        required: false
        type: boolean
        default: false
      draft:
        description: '创建为草稿（不立即公开）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.38.10
  JAVA_VERSION: '17'
  KEYSTORE_FILE: danmu-float-release.jks

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（完整历史，供生成 changelog）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 解析版本与 tag
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '[:space:]')"
          version_name="${pubspec_version%%+*}"
          if [[ -z "$version_name" ]]; then
            echo "::error::无法从 pubspec.yaml 解析 version 字段"
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="v${version_name}"
          fi
          if [[ "$tag" != "v${version_name}" ]]; then
            echo "::error::tag（$tag）与 pubspec.yaml 的 version（v$version_name）不一致，请先同步 pubspec.yaml"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version_name=$version_name"
            echo "pubspec_version=$pubspec_version"
          } >> "$GITHUB_OUTPUT"
          echo "发布 tag：$tag（pubspec version：$pubspec_version）"

      - name: 还原签名文件
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::缺少仓库 Secret：$name（填写说明见 scripts/generate-keystore.ps1 的运行输出）"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "android/app/$KEYSTORE_FILE"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$KEYSTORE_FILE"
          } > android/key.properties
          # 校验密码、别名与 keystore 匹配，避免 Gradle 静默回退 debug 签名
          keytool -list -keystore "android/app/$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "签名文件已还原并通过校验：android/app/$KEYSTORE_FILE"

      - name: 获取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 构建 arm64 精简包
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # 限定 android-arm64 + split-per-abi：只编 arm64 一个 ABI，避免白编另外两个拆分包的产物
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/DanmuFloat-${TAG}-arm64-v8a.apk"

      - name: 构建通用包
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "dist/DanmuFloat-${TAG}-universal.apk"

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          ls -lh

      - name: 安装 git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: 生成 changelog
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            git cliff --current --strip all > RELEASE_NOTES.md
          else
            git cliff --unreleased --tag "${TAG}" --strip all > RELEASE_NOTES.md
          fi
          echo '----- RELEASE_NOTES.md -----'
          cat RELEASE_NOTES.md

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          if [[ "$IS_DRAFT" == "true" ]]; then flags+=(--draft); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明与产物"
            gh release edit "$TAG" --title "DanmuFloat ${TAG}" --notes-file RELEASE_NOTES.md ${flags[@]+"${flags[@]}"}
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "DanmuFloat ${TAG}" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA" \
              ${flags[@]+"${flags[@]}"}
          fi
          echo "Release 地址：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"