# git-cliff 配置：按 Conventional Commits 生成中文 Release Notes。
# 提交信息规范见仓库规则 .trae/rules/git-commit-message.md，
# 类型白名单：build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test

[changelog]
header = ""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }}（{{ timestamp | date(format="%Y-%m-%d") }}）
{% else %}\
    ## 未发布
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**：{% endif %}\
            {% if commit.breaking %}**（破坏性变更）** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "新功能" },
    { message = "^fix", group = "问题修复" },
    { message = "^perf", group = "性能优化" },
    { message = "^refactor", group = "代码重构" },
    { message = "^docs", group = "文档" },
    { message = "^style", group = "代码风格" },
    { message = "^test", group = "测试" },
    { message = "^build", group = "构建" },
    { message = "^ci", group = "持续集成" },
    { message = "^chore", group = "杂项" },
    { message = "^revert", group = "回滚" },
    { message = ".*", group = "其他" },
]